name: Trigger auto deployment for policylens

on:
  push:
    branches: 
      [ main ]
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.POLICYLENS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.POLICYLENS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.POLICYLENS_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          containerAppName: policylens
          resourceGroup: Policylens
          imageToBuild: ghcr.io/${{ github.repository_owner }}/policylens-mcp:${{ github.sha }}